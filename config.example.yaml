# ============================================================================
# PC Agent - шаблон конфигурации
# ----------------------------------------------------------------------------
# Скопируйте файл в config.yaml и поправьте значения под себя:
#   copy config.example.yaml config.yaml
# Здесь нет личных данных и ключей API. Ключ кладётся в .env
# (PCAGENT_API_KEY или имя переменной провайдера).
#
# Клиент универсальный: провайдер определяется по ключу, модель подбирается
# автоматически (model: auto). Менять модель нужно только осознанно.
# ============================================================================

# --- доступ к модели -------------------------------------------------------
model: auto                      # auto - подобрать модель под провайдера ключа;
                                 # можно указать точное имя, например gemini-2.5-flash,
                                 # gpt-4o-mini, deepseek-chat, claude-sonnet-4-5
fallback_models: []              # запасные модели; имена у провайдеров несовместимы,
                                 # поэтому по умолчанию список пуст
temperature: 0.2                 # 0..1: ниже - стабильнее, выше - свободнее
request_timeout_s: 120           # таймаут одного запроса к провайдеру, секунды
stub_mode: false                 # true - оффлайн-режим без обращений к сети

# --- агентный цикл ---------------------------------------------------------
max_steps: 100                   # максимум шагов на одну задачу
action_delay: 0.7                # ПРЕДЕЛ ожидания, пока экран успокоится после
                                 # действия (обычно 0.2-0.3 с, не фиксированный сон)
max_history_images: 3            # сколько снимков экрана держать в истории
max_tool_result_chars: 6000      # предел размера одного ответа инструмента в истории
keep_tool_results: 6             # сколько последних результатов хранить полностью

# --- снимки экрана ---------------------------------------------------------
monitor: 0                       # 0 - основной монитор, N - номер монитора, -1 - все
screenshot_max_width: 1440       # ширина снимка для модели, px
screenshot_format: jpeg          # jpeg | png
screenshot_quality: 70           # качество jpeg, 1..100
save_screenshots: false          # сохранять снимки на диск (отладка)
screenshot_dir: screenshots      # папка для снимков

# --- чтение интерфейса -----------------------------------------------------
include_uia_tree: true           # передавать модели дерево UI Automation
uia_max_nodes: 250               # предел узлов дерева

# --- безопасность ----------------------------------------------------------
confirm_mode: risky              # never | risky | always
allow_destructive: true          # деструктивные инструменты (после подтверждения)
allow_shell: true                # выполнение команд ОС (с deny-list)
dry_run: false                   # true - ничего не выполнять, только показывать

# --- прочее ----------------------------------------------------------------
language: ru                     # язык ответов
enabled_categories:              # группы инструментов
  - capture
  - input
  - windows
  - system
log_dir: logs                    # журнал аудита JSONL
stop_hotkey: ctrl+alt+q          # глобальная горячая клавиша стоп-крана

# --- необязательные ключи в секции extra -----------------------------------
# Ключи, которых нет в AppConfig, складываются в extra и не ломают запуск.
# extra:
#   provider: openrouter         # жёстко задать провайдера вместо автоопределения
#   base_url: https://...        # свой шлюз или прокси, совместимый с OpenAI API
#   tool_routing: true           # отбор инструментов под текст задачи (экономия токенов)
#   tool_compact: true           # сжатие описаний инструментов
